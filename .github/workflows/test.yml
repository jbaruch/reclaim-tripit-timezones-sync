name: Runtime tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Keep this aligned with NanoClaw's node:24-slim agent image.
          node-version: '24.22.0'
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: JavaScript diagnostics
        run: npm run typecheck
      - name: Release script diagnostics
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: ${{ env.SHELLCHECK_VERSION }}
          scandir: ./scripts
          check_together: 'true'
      - name: Skill script diagnostics
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: ${{ env.SHELLCHECK_VERSION }}
          scandir: ./skills/sync-tripit/scripts
          check_together: 'true'
      - run: npm test
