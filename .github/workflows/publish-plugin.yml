name: Publish plugin to Tessl registry

on:
  push:
    branches: [main]
    paths:
      - '.tessl-plugin/**'
      - 'rules/**'
      - 'skills/**'
      - 'evals/**'
      - 'README.md'
      - '.tesslignore'

# Serialize publishes on main: a closely-following push could otherwise race
# (both runs querying the same registry version, both publishing the same
# version). Queue subsequent runs instead of cancelling so no push is lost.
concurrency:
  group: publish-plugin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # push the vX.Y.Z tag
  id-token: write   # tessl CLI OIDC auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the explicit plugin version
        id: vchange
        run: |
          LOCAL_VERSION=$(jq -er '.version' .tessl-plugin/plugin.json)
          if [[ ! "$LOCAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Repair plugin.json with a complete release version before publishing.' >&2
            exit 1
          fi
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Tessl CLI
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2; Renovate renews GitHub Actions pins.
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Lint plugin
        run: tessl plugin lint

      - name: Review skills before publication
        uses: jbaruch/coding-policy/.github/actions/skill-review@f396973a41c359b7ee00950b48817d9603563772
        with:
          threshold: '85'

      - name: Ensure the reviewed source archive exists
        # Review completes before any immutable artifact. A failed earlier
        # review may have left this explicit version without its tag.
        run: |
          TAG="v${{ steps.vchange.outputs.version }}"
          SOURCE=$(git rev-parse HEAD)
          EXISTING=$(git ls-remote --tags origin "refs/tags/${TAG}")
          if [ -n "$EXISTING" ]; then
            git fetch --quiet --no-tags origin "refs/tags/${TAG}"
            TAG_SOURCE=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [ "$TAG_SOURCE" != "$SOURCE" ]; then
              echo "Tag $TAG belongs to another source. Bump the plugin and pinned installation URLs before retrying; existing tags are never moved." >&2
              exit 1
            fi
            echo "Verified existing tag $TAG at the reviewed source"
          else
            git tag "$TAG" "$SOURCE"
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at the reviewed source"
          fi

      - name: Publish plugin to Tessl registry
        # Publishes the version pinned in .tessl-plugin/plugin.json. Plugins
        # do not auto-bump the patch number, so the published version always
        # equals plugin.json — which is why the tag step above is exact.
        run: tessl plugin publish
