name: Publish tile to Tessl registry

on:
  push:
    branches: [main]
    paths:
      - '.tile/**'

# Serialize publishes on main: a closely-following push could otherwise race
# (both runs querying the same registry version, both bumping to the same
# patch). Queue subsequent runs instead of cancelling so no version is lost.
concurrency:
  group: publish-tile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect tile.json version change in this push
        id: vchange
        # Only pre-tag if the user actually bumped the tile.json version in
        # this push. Otherwise a missing tag is a manual fix-up situation,
        # not something we should auto-create at the wrong commit.
        run: |
          BEFORE="${{ github.event.before }}"
          LOCAL_VERSION=$(jq -r '.version' .tile/tile.json)
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "First push or unknown before-ref; not pre-tagging"
            exit 0
          fi
          PREV_VERSION=$(git show "$BEFORE:.tile/tile.json" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$LOCAL_VERSION" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "tile.json version bumped: $PREV_VERSION → $LOCAL_VERSION"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "tile.json version unchanged ($LOCAL_VERSION)"
          fi

      - name: Pre-tag the user-bumped tile.json version
        # Runs only when this push actually bumped the version. The
        # in-skill curl URL inside the bundle now references vX.Y.Z, so
        # tag this merge commit BEFORE the registry publish so consumers
        # who fresh-install the new tile don't 404 on the install URL.
        # Use `git ls-remote` so the existence check doesn't depend on
        # the local checkout having fetched tags.
        if: steps.vchange.outputs.bumped == 'true'
        run: |
          TAG="v${{ steps.vchange.outputs.version }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag $TAG already exists on origin, no pre-tag needed"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG at the merge commit"
          fi

      - name: Publish tile to Tessl registry
        # Pinned to a commit SHA (corresponds to the v1 tag at the time of
        # adoption) for supply-chain immutability. Bump the SHA explicitly
        # when upgrading the action.
        uses: tesslio/patch-version-publish@088d998ba027eb8f646397e83fcd263cd336f139
        id: publish
        with:
          token: ${{ secrets.TESSL_TOKEN }}
          path: .tile

      - name: Tag the published version
        # If the action auto-bumped the patch number, tag that version
        # too so the registry version's git ref exists for auditability.
        # Validate the output looks like a semver string before tagging
        # to avoid pushing a bogus `v` tag if the output is unset.
        if: ${{ steps.publish.outputs.version }}
        run: |
          PUBLISHED="${{ steps.publish.outputs.version }}"
          if ! printf '%s' "$PUBLISHED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Published version output '$PUBLISHED' is not a valid X.Y.Z; not tagging" >&2
            exit 0
          fi
          TAG="v${PUBLISHED}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag $TAG already exists on origin, skipping"
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
            echo "Created tag $TAG at the action's post-bump commit"
          fi
